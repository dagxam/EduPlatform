<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d68f0">
  <title>Нет подключения — UROVIA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png?v=3">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#17202a}
    body{min-height:100vh;display:grid;place-items:center;padding:22px}
    .card{width:min(460px,100%);background:#fff;border:1px solid #e4e9ef;border-radius:22px;padding:30px;text-align:center;box-shadow:0 18px 55px rgba(24,40,65,.08)}
    .icon{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:#edf4ff;color:#1d68f0;display:grid;place-items:center;font-size:32px;font-weight:900}
    h1{margin:0 0 10px;font-size:25px}p{margin:0;color:#75818e;line-height:1.55}
    button{margin-top:22px;width:100%;border:0;border-radius:12px;padding:13px;background:#1d68f0;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
    small{display:block;margin-top:16px;color:#9aa4ae}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">U</div>
    <h1>Нет подключения к интернету</h1>
    <p>Интерфейс UROVIA доступен как приложение, но для входа, начала задания и отправки результатов требуется интернет.</p>
    <button type="button" onclick="location.reload()">Проверить подключение</button>
    <small>Ваши результаты не будут отправлены, пока соединение не восстановится.</small>
  </main>
</body>
</html>
