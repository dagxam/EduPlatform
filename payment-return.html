<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплата UROVIA</title><link rel="icon" href="favicon.png?v=3"><link rel="stylesheet" href="legal.css?v=2"></head><body><main class="legal-shell"><header class="legal-head"><div class="legal-brand"><div class="legal-mark">U</div><div><b>UROVIA</b><span>Оплата подписки</span></div></div><h1 id="paymentTitle">Проверяем платёж…</h1><p id="paymentText">Подтверждение от ЮKassa может занять несколько секунд.</p><div class="legal-actions"><a class="primary" href="index.html">Вернуться в UROVIA</a><a class="secondary" href="pricing.php">Тарифы</a></div></header></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('order_id');if(!id){document.getElementById('paymentTitle').textContent='Платёж не найден';return;}for(let i=0;i<10;i++){try{const r=await fetch('./api/subscription/order-status.php?order_id='+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(r.status===401||r.status===403){location.href='login.html';return;}if(d.ok){const s=d.order.status;if(s==='succeeded'){document.getElementById('paymentTitle').textContent='Оплата прошла успешно';document.getElementById('paymentText').textContent='Подписка активирована. Можно вернуться в UROVIA.';return;}if(['cancelled','failed','refunded'].includes(s)){document.getElementById('paymentTitle').textContent='Оплата не завершена';document.getElementById('paymentText').textContent='Подписка не была активирована. Вы можете повторить оплату из раздела «Тариф и подписка».';return;}}}catch(e){}await new Promise(r=>setTimeout(r,2000));}document.getElementById('paymentTitle').textContent='Платёж обрабатывается';document.getElementById('paymentText').textContent='Если деньги списаны, подписка активируется после подтверждения ЮKassa. Обновите страницу через некоторое время.';})();
</script></body></html>
