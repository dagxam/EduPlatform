name: Deploy UROVIA to hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: urovia_ci_root
          MYSQL_DATABASE: urovia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -purovia_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare one-time MySQL migration key
        if: ${{ hashFiles('.github/mysql-migration-request') != '' && hashFiles('database/mysql-credentials.enc') == '' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/mysql-migration-private.pem
          openssl pkey -in /tmp/mysql-migration-private.pem -pubout -out /tmp/mysql-migration-public.pem
          curl --fail --silent --show-error --ftp-create-dirs             --user "$FTP_USERNAME:$FTP_PASSWORD"             -T /tmp/mysql-migration-private.pem             "ftp://188.127.241.85/storage/mysql-migration-private.pem"

      - name: Publish one-time migration public key
        if: ${{ hashFiles('.github/mysql-migration-request') != '' && hashFiles('database/mysql-credentials.enc') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-public-key
          path: /tmp/mysql-migration-public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, zip

      - name: Validate PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check question-builder.js
          node --check login.js
          node --check attempt-security.js
          node --check pwa.js

      - name: Validate SQLite schema
        run: |
          php -r '$pdo = new PDO("sqlite::memory:"); $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION); $pdo->exec(file_get_contents("database/schema.sql")); echo "SQLite schema OK\n";'

      - name: Validate mixed assignment parser
        run: php .github/tests/import-template-smoke.php

      - name: Validate import-to-grading pipeline
        run: php .github/tests/grading-smoke.php

      - name: Validate backup engine
        run: |
          php -r 'require "api/bootstrap.php"; $pdo = app_db(); $backup = backup_create_archive($pdo, "manual"); if (empty($backup["file"]) || empty($backup["size_bytes"])) { fwrite(STDERR, "Backup smoke test failed\n"); exit(1); } echo "Backup engine OK: " . $backup["file"] . "\n";'

      - name: Validate security regressions
        run: php .github/tests/security-smoke.php

      - name: Validate MySQL 8 compatibility
        run: php .github/tests/mysql-smoke.php

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 188.127.241.85
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          # FTP account is already rooted at the live UROVIA directory.
          # Do not prepend /www/... here or nested duplicate folders will be created.
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            docs/**
            README.md
            storage/*.sqlite
            storage/*.sqlite-*
            storage/assignment-imports/**
            storage/question-assets/**
            storage/avatars/**
            storage/backups/**
            storage/db-config.php
            storage/db-config.php.tmp
            storage/maintenance.flag
            storage/.mysql-migration.lock
            storage/mysql-migration.json
            storage/mysql-migration-private.pem
            storage/mysql-machine-migration.done

      - name: Run one-time encrypted MySQL migration
        if: ${{ hashFiles('database/mysql-credentials.enc') != '' }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --max-time 300             -X POST "https://urovia.ru/api/database/migrate-machine.php")"
          echo "$response" | php -r '
            $raw = stream_get_contents(STDIN);
            $data = json_decode($raw, true);
            if (!is_array($data) || empty($data["ok"])) {
              fwrite(STDERR, "MySQL migration failed: " . $raw . PHP_EOL);
              exit(1);
            }
            $summary = $data["summary"] ?? [];
            echo "MySQL migration OK";
            if (isset($summary["total_rows"])) echo ": " . $summary["total_rows"] . " rows";
            echo PHP_EOL;
          '
