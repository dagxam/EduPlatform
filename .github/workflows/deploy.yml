name: Deploy UROVIA to hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: urovia-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: urovia_ci_root
          MYSQL_DATABASE: urovia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -purovia_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, zip, curl

      - name: Validate PHP
        run: |
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l requisites.php
          php -l pricing.php
          php -l offer.php
          php -l payment-info.php

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check question-builder.js
          node --check login.js
          node --check attempt-security.js
          node --check pwa.js
          node --check paper.js
          node --check paper-workspace.js
          node --check paper-scan.js
          node --check paper-cabinet.js

      - name: Validate UROVIA PAPER grading and QR
        run: |
          php .github/tests/paper-grading-smoke.php
          php .github/tests/paper-preview-smoke.php
          php .github/tests/paper-choice-policy-smoke.php
          php .github/tests/paper-subscription-ai-smoke.php
          php .github/tests/paper-one-point-smoke.php
          php .github/tests/paper-validation-smoke.php
          node .github/tests/paper-print-types-smoke.cjs
          node .github/tests/paper-image-question-smoke.cjs
          node .github/tests/paper-mixed-scan-smoke.cjs
          node .github/tests/paper-qr-smoke.cjs
          php .github/tests/paper-cabinet-smoke.php
          node .github/tests/paper-design-smoke.cjs
          node .github/tests/paper-branding-smoke.cjs
          node .github/tests/paper-navigation-smoke.cjs
          php .github/tests/paper-versions-smoke.php
          php .github/tests/paper-versions-smoke.php --mysql
          node .github/tests/paper-layout-smoke.cjs
          node .github/tests/paper-compact-smoke.cjs
          node .github/tests/paper-camera-smoke.cjs
          php .github/tests/paper-in-place-smoke.php
          php .github/tests/paper-in-place-smoke.php --mysql
          php .github/tests/paper-catalog-archive-smoke.php

      - name: Validate tablet layout and PWA installation
        run: node .github/tests/pwa-tablet-smoke.mjs

      - name: Validate PWA installed-state behavior
        run: node .github/tests/pwa-install-behavior.mjs

      - name: Validate personal data compliance wiring
        run: node .github/tests/privacy-compliance-smoke.mjs

      - name: Validate SQLite schema
        run: |
          php -r '$pdo = new PDO("sqlite::memory:"); $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION); $pdo->exec(file_get_contents("database/schema.sql")); echo "SQLite schema OK\n";'

      - name: Validate mixed assignment parser
        run: php .github/tests/import-template-smoke.php

      - name: Validate student roster file formats
        run: php .github/tests/student-roster-import-smoke.php

      - name: Validate import-to-grading pipeline
        run: php .github/tests/grading-smoke.php

      - name: Validate configurable grading scale
        run: php .github/tests/grading-scale-smoke.php

      - name: Validate journal history retention
        run: php .github/tests/journal-history-smoke.php

      - name: Validate leaderboards
        run: php .github/tests/leaderboard-smoke.php

      - name: Validate result editing and Android focus handling
        run: php .github/tests/result-editing-smoke.php

      - name: Validate assignment overview editing
        run: php .github/tests/assignment-overview-editing-smoke.php

      - name: Validate active assignment question revisions
        run: php .github/tests/active-assignment-revision-smoke.php

      - name: Validate per-student shuffled variants
        run: php .github/tests/student-variant-shuffle-smoke.php

      - name: Validate UROVIA library UX
        run: php .github/tests/library-ux-smoke.php

      - name: Validate teacher growth features
        run: php .github/tests/teacher-growth-features-smoke.php

      - name: Validate teacher and student UX stage 2
        run: php .github/tests/teacher-student-ux-smoke.php

      - name: Validate subscription stage 1
        run: php .github/tests/subscription-stage1-smoke.php

      - name: Validate admin subscription grants
        run: php .github/tests/admin-subscription-grant-smoke.php

      - name: Validate YooKassa integration
        run: php .github/tests/yookassa-integration-smoke.php

      - name: Validate stale attempt recovery
        run: php .github/tests/stale-attempt-recovery-smoke.php

      - name: Validate backup engine
        run: |
          php -r 'require "api/bootstrap.php"; $pdo = app_db(); $backup = backup_create_archive($pdo, "manual"); if (empty($backup["file"]) || empty($backup["size_bytes"])) { fwrite(STDERR, "Backup smoke test failed\n"); exit(1); } echo "Backup engine OK: " . $backup["file"] . "\n";'

      - name: Validate security regressions
        run: php .github/tests/security-smoke.php

      - name: Validate MySQL 8 compatibility
        run: php .github/tests/mysql-smoke.php

      - name: Validate 300-student MySQL concurrency
        run: php .github/tests/mysql-concurrency-smoke.php

      - name: Validate release update notification
        run: node .github/tests/release-update-smoke.mjs

      - name: Stamp release metadata
        if: github.ref == 'refs/heads/main'
        run: |
          printf '{"version":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          SHORT_SHA="${GITHUB_SHA:0:12}"
          sed -i "s/const RELEASE = 'dev';/const RELEASE = '${GITHUB_SHA}';/" sw.js
          for file in index.html login.html paper.html paper-workspace.html; do
            sed -E -i "s/(<meta name=\"urovia-release\" content=\")[^\"]*(\">)/\1${GITHUB_SHA}\2/" "$file"
            sed -E -i "s/\?v=[0-9]+/?v=${SHORT_SHA}/g" "$file"
          done

      - name: Upload site over FTP
        id: ftp_upload
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 188.127.241.85
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./
          # FTP account is already rooted at the live UROVIA directory.
          # Do not prepend /www/... here or nested duplicate folders will be created.
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            docs/**
            README.md
            storage/*.sqlite
            storage/*.sqlite-*
            storage/assignment-imports/**
            storage/question-assets/**
            storage/avatars/**
            storage/backups/**
            storage/db-config.php
            storage/db-config.php.tmp
            storage/yookassa-config.php
            storage/yookassa-config.php.tmp
            storage/ai-config.php
            storage/ai-config.php.tmp
            storage/maintenance.flag
            storage/.mysql-migration.lock
            storage/mysql-migration.json
            storage/mysql-migration-private.pem
            storage/mysql-machine-migration.done

      - name: Retry FTP upload after connection failure
        if: github.ref == 'refs/heads/main' && steps.ftp_upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 188.127.241.85
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./
          # FTP account is already rooted at the live UROVIA directory.
          # Do not prepend /www/... here or nested duplicate folders will be created.
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            docs/**
            README.md
            storage/*.sqlite
            storage/*.sqlite-*
            storage/assignment-imports/**
            storage/question-assets/**
            storage/avatars/**
            storage/backups/**
            storage/db-config.php
            storage/db-config.php.tmp
            storage/yookassa-config.php
            storage/yookassa-config.php.tmp
            storage/ai-config.php
            storage/ai-config.php.tmp
            storage/maintenance.flag
            storage/.mysql-migration.lock
            storage/mysql-migration.json
            storage/mysql-migration-private.pem
            storage/mysql-machine-migration.done

      - name: Verify live UROVIA after deploy
        if: github.ref == 'refs/heads/main'
        run: bash .github/tests/live-production-smoke.sh
