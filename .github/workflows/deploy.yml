name: Deploy EduPlatform to hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check login.js

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 188.127.241.85
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            docs/**
            README.md
